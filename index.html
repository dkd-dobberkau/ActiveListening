<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ActiveListening</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <h1 id="app-title">ActiveListening</h1>
      <div class="header-actions">
        <div id="lang-switcher" class="lang-switcher"></div>
        <button id="btn-help" class="btn-icon" aria-label="Help">?</button>
        <button id="btn-sets" class="btn-icon" aria-label="Meeting Sets">☰</button>
      </div>
    </header>

    <main id="view-browse" class="view active">
      <nav id="categories" class="categories" aria-label="Categories"></nav>

      <div class="card-container">
        <div id="card" class="card">
          <p class="card-question"></p>
          <hr>
          <p class="card-explanation"></p>
          <button id="btn-add-to-set" class="btn-secondary">+ Set</button>
        </div>
      </div>

      <div class="navigation">
        <button id="btn-prev" class="btn-nav" aria-label="Previous">←</button>
        <div id="dots" class="dots"></div>
        <button id="btn-next" class="btn-nav" aria-label="Next">→</button>
      </div>
    </main>

    <aside id="view-sets" class="view">
      <header class="sets-header">
        <button id="btn-back" class="btn-icon" aria-label="Back">←</button>
        <h2 id="sets-title">Meeting Sets</h2>
      </header>
      <div id="sets-list" class="sets-list"></div>
      <button id="btn-new-set" class="btn-primary">+ New Set</button>
      <div class="sets-actions">
        <button id="btn-import" class="btn-secondary">⬆ Import</button>
        <button id="btn-export-all" class="btn-secondary">⬇ Export All</button>
      </div>
      <input type="file" id="file-import" accept=".json" hidden>
    </aside>

    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <h3 id="modal-title"></h3>
        <div id="modal-body"></div>
        <div class="modal-actions">
          <button id="modal-cancel" class="btn-secondary">Cancel</button>
          <button id="modal-confirm" class="btn-primary">OK</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
